services:
  - type: web
    name: medisync-api
    env: node
    plan: free
    buildCommand: npm install && npm --prefix server install
    startCommand: npm --prefix server start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLIENT_URL
        value: https://medi-sync-7zpm.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false


