services:
  mongodb:
    image: mongo:latest
    container_name: medisync_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    container_name: medisync_redis
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma:latest
    container_name: medisync_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  server:
    build: ./server
    container_name: medisync_server
    env_file: ./server/.env
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/medisync
      - REDIS_URI=redis://redis:6379
      - CHROMA_URL=http://chromadb:8000
      - JWT_SECRET=your_jwt_secret_here
      # Allow frontend to access the API if it's hosted differently. Usually handled by nginx proxy, but here they run on different ports.
    depends_on:
      - mongodb
      - redis
      - chromadb

  client:
    build:
      context: ./client
      args:
        # Pass VITE_API_URL to the build process so it's baked into the static files
        - VITE_API_URL=http://localhost:5000
    container_name: medisync_client
    ports:
      - "3000:80" # Mapping to port 3000 on the host to avoid port 80 conflicts usually
    depends_on:
      - server

volumes:
  mongodb_data:
  chroma_data:
